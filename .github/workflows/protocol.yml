# The real server.py on CPU with stand-in models (whisper tiny, t5-small, two
# Piper voices, VoxLingua107, Silero): the WebSocket protocol end to end. See
# tests/test_protocol.py. Models are cached between runs (~0.6 GB).
name: Protocol

on:
  push:
  pull_request:

concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # torch.hub asks the GitHub API about snakers4/silero-vad on a cold cache;
      # a token avoids the anonymous rate limit on shared runner IPs.
      GITHUB_TOKEN: ${{ github.token }}
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch/hub
            ~/.cache/lithos-stack-test
          key: protocol-models-${{ hashFiles('requirements-test.txt', 'languages.toml') }}
          restore-keys: protocol-models-

      - name: Install (CPU torch)
        run: |
          pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - name: Protocol tests
        run: python -m pytest tests/test_protocol.py -v -rs
