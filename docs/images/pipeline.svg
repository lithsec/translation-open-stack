<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" font-family="Helvetica, Arial, sans-serif">
  <!-- Source of pipeline.png. Render: rsvg-convert -z 2 pipeline.svg -o pipeline.png -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16201D"/>
    </marker>
  </defs>
  <rect x="4" y="4" width="1392" height="592" rx="22" fill="#FFFFFF" stroke="#D3DBD8" stroke-width="2"/>

  <!-- title -->
  <g transform="translate(40,58)">
    <polygon points="18,0 28.6,3.4 35.2,12.4 35.2,23.6 28.6,32.6 18,36 7.4,32.6 0.8,23.6 0.8,12.4 7.4,3.4" fill="#2e2b28" stroke="#c9a227" stroke-width="2.4" stroke-linejoin="round" transform="translate(0,-28)"/>
    <rect x="11" y="-18" width="14" height="3.2" rx="1.6" fill="#c9a227"/>
    <rect x="11" y="-11.6" width="14" height="3.2" rx="1.6" fill="#e8e0d0"/>
    <rect x="11" y="-5.2" width="14" height="3.2" rx="1.6" fill="#8f8577"/>
    <text x="50" y="0" font-size="30" font-weight="700" fill="#16201D">Translation Open Stack: one pipeline, every language</text>
  </g>
  <text x="90" y="88" font-size="17" fill="#5B6763">Microphone audio in, translated captions and speech out, over one WebSocket per listening language. Open-weight models, one GPU.</text>

  <!-- client in -->
  <rect x="30" y="200" width="150" height="220" rx="14" fill="#F3F5F4" stroke="#16201D" stroke-width="2"/>
  <text x="105" y="240" font-size="18" font-weight="700" fill="#16201D" text-anchor="middle">Client app</text>
  <text x="105" y="266" font-size="14" fill="#5B6763" text-anchor="middle">speaker's mic</text>
  <g transform="translate(88,288)" fill="none" stroke="#16201D" stroke-width="2.4" stroke-linecap="round">
    <rect x="8" y="0" width="18" height="30" rx="9"/>
    <path d="M1,20 a16,16 0 0 0 32,0"/>
    <path d="M17,36 v10 M9,46 h16"/>
  </g>
  <text x="105" y="370" font-size="13" fill="#5B6763" text-anchor="middle">PCM16 mono</text>
  <text x="105" y="388" font-size="13" fill="#5B6763" text-anchor="middle">24 kHz, ~100 ms</text>
  <text x="105" y="406" font-size="13" fill="#5B6763" text-anchor="middle">frames</text>

  <!-- ws in -->
  <rect x="196" y="200" width="34" height="220" rx="17" fill="#E6F0FA" stroke="#1D6FB8" stroke-width="2"/>
  <text transform="translate(219,310) rotate(-90)" font-size="15" font-weight="700" fill="#1D6FB8" text-anchor="middle">WebSocket</text>

  <!-- server container -->
  <rect x="246" y="150" width="908" height="340" rx="16" fill="#F7F9F8" stroke="#5B6763" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="266" y="178" font-size="14" font-weight="700" fill="#5B6763" letter-spacing="1.5">STACK SERVER  ·  server.py on :8790  ·  one shared pipeline per room</text>

  <!-- stage boxes: x = 262, 440, 618, 796, 974 ; width 164 -->
  <g font-size="14" fill="#16201D">
    <!-- 1 VAD -->
    <rect x="262" y="200" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D3DBD8" stroke-width="1.5"/>
    <rect x="262" y="200" width="7" height="220" rx="3" fill="#0E7C68"/>
    <text x="280" y="226" font-size="12" font-weight="700" fill="#5B6763" letter-spacing="1">1 · DETECT SPEECH</text>
    <text x="280" y="256" font-size="18" font-weight="700">Silero VAD</text>
    <text x="280" y="282" fill="#5B6763">When a sentence</text>
    <text x="280" y="300" fill="#5B6763">ends; keeps silence</text>
    <text x="280" y="318" fill="#5B6763">away from Whisper</text>
    <text x="280" y="404" font-size="12" fill="#0E7C68" font-weight="700">CPU · MIT</text>

    <!-- 2 LID -->
    <rect x="440" y="200" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D3DBD8" stroke-width="1.5"/>
    <rect x="440" y="200" width="7" height="220" rx="3" fill="#5B3FD6"/>
    <text x="458" y="226" font-size="12" font-weight="700" fill="#5B6763" letter-spacing="1">2 · LANGUAGE ID</text>
    <text x="458" y="256" font-size="18" font-weight="700">VoxLingua107</text>
    <text x="458" y="282" fill="#5B6763">Per utterance, among</text>
    <text x="458" y="300" fill="#5B6763">the room's SRCS;</text>
    <text x="458" y="318" fill="#5B6763">picks the recogniser</text>
    <text x="458" y="346" font-size="12" fill="#5B6763">skipped when src is fixed</text>
    <text x="458" y="404" font-size="12" fill="#5B3FD6" font-weight="700">GPU · Apache 2.0</text>

    <!-- 3 ASR -->
    <rect x="618" y="200" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D3DBD8" stroke-width="1.5"/>
    <rect x="618" y="200" width="7" height="220" rx="3" fill="#5B3FD6"/>
    <text x="636" y="226" font-size="12" font-weight="700" fill="#5B6763" letter-spacing="1">3 · RECOGNISE</text>
    <text x="636" y="256" font-size="18" font-weight="700">Whisper</text>
    <text x="636" y="276" font-size="13" fill="#5B6763">large-v3 · most langs</text>
    <text x="636" y="310" font-size="18" font-weight="700">Omnilingual</text>
    <text x="636" y="330" font-size="13" fill="#5B6763">ASR 300M · fa bn ur hi</text>
    <text x="636" y="347" font-size="13" fill="#5B6763">sw ht km lo</text>
    <text x="636" y="404" font-size="12" fill="#5B3FD6" font-weight="700">GPU · MIT / Apache 2.0</text>

    <!-- 4 MT -->
    <rect x="796" y="200" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D3DBD8" stroke-width="1.5"/>
    <rect x="796" y="200" width="7" height="220" rx="3" fill="#5B3FD6"/>
    <text x="814" y="226" font-size="12" font-weight="700" fill="#5B6763" letter-spacing="1">4 · TRANSLATE</text>
    <text x="814" y="256" font-size="18" font-weight="700">Hy-MT2 7B</text>
    <text x="814" y="276" font-size="13" fill="#5B6763">4-bit · 36 languages</text>
    <text x="814" y="310" font-size="18" font-weight="700">MADLAD-400</text>
    <text x="814" y="330" font-size="13" fill="#5B6763">7B int8 · sw ro ht lo</text>
    <text x="814" y="358" font-size="12" fill="#5B6763">all targets in one batch</text>
    <text x="814" y="404" font-size="12" fill="#5B3FD6" font-weight="700">GPU · Apache 2.0</text>

    <!-- 5 TTS -->
    <rect x="974" y="200" width="164" height="220" rx="12" fill="#FFFFFF" stroke="#D3DBD8" stroke-width="1.5"/>
    <rect x="974" y="200" width="7" height="220" rx="3" fill="#A8661A"/>
    <text x="992" y="226" font-size="12" font-weight="700" fill="#5B6763" letter-spacing="1">5 · SPEAK</text>
    <text x="992" y="254" font-size="16" font-weight="700">Kokoro <tspan font-weight="400" font-size="13" fill="#5B6763">GPU</tspan></text>
    <text x="992" y="278" font-size="16" font-weight="700">VoxCPM2 <tspan font-weight="400" font-size="13" fill="#5B6763">GPU</tspan></text>
    <text x="992" y="302" font-size="16" font-weight="700">Piper <tspan font-weight="400" font-size="13" fill="#5B6763">CPU</tspan></text>
    <text x="992" y="326" font-size="16" font-weight="700">Coqui <tspan font-weight="400" font-size="13" fill="#5B6763">commercial</tspan></text>
    <text x="992" y="350" font-size="16" font-weight="700">MMS <tspan font-weight="400" font-size="13" fill="#5B6763">nonprofit</tspan></text>
    <text x="992" y="378" font-size="12" fill="#5B6763">first voice that works</text>
    <text x="992" y="404" font-size="12" fill="#A8661A" font-weight="700">licence varies by voice</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#16201D" stroke-width="2" marker-end="url(#arr)">
    <line x1="230" y1="310" x2="258" y2="310"/>
    <line x1="426" y1="310" x2="436" y2="310"/>
    <line x1="604" y1="310" x2="614" y2="310"/>
    <line x1="782" y1="310" x2="792" y2="310"/>
    <line x1="960" y1="310" x2="970" y2="310"/>
    <line x1="1138" y1="310" x2="1166" y2="310"/>
  </g>

  <!-- ws out -->
  <rect x="1170" y="200" width="34" height="220" rx="17" fill="#E6F0FA" stroke="#1D6FB8" stroke-width="2"/>
  <text transform="translate(1193,310) rotate(-90)" font-size="15" font-weight="700" fill="#1D6FB8" text-anchor="middle">WebSocket</text>
  <line x1="1204" y1="310" x2="1216" y2="310" stroke="#16201D" stroke-width="2" marker-end="url(#arr)"/>

  <!-- client out -->
  <rect x="1220" y="200" width="150" height="220" rx="14" fill="#F3F5F4" stroke="#16201D" stroke-width="2"/>
  <text x="1295" y="240" font-size="18" font-weight="700" fill="#16201D" text-anchor="middle">Client app</text>
  <text x="1295" y="266" font-size="14" fill="#5B6763" text-anchor="middle">each listener</text>
  <g transform="translate(1275,290)" fill="none" stroke="#16201D" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M2,12 h9 l11,-10 v36 l-11,-10 h-9 z"/>
    <path d="M28,12 a10,10 0 0 1 0,16 M32,6 a17,17 0 0 1 0,28"/>
  </g>
  <text x="1295" y="352" font-size="13" fill="#5B6763" text-anchor="middle">captions (JSON)</text>
  <text x="1295" y="370" font-size="13" fill="#5B6763" text-anchor="middle">+ speech (PCM16)</text>
  <text x="1295" y="388" font-size="13" fill="#5B6763" text-anchor="middle">in their language</text>

  <!-- footer notes -->
  <g font-size="14" fill="#16201D">
    <text x="266" y="462">Same language in and out: the listener gets the speaker's own audio, no translation.</text>
    <text x="40" y="536" font-weight="700">~0.8 s</text>
    <text x="100" y="536" fill="#5B6763">from the end of a sentence to translated speech (measured in docs/dev/model-evaluation.md).</text>
    <text x="40" y="562" font-weight="700">Room</text>
    <text x="100" y="562" fill="#5B6763">?room=main shares one VAD, one recognition and one batched translation across every listening language.</text>
  </g>
  <g font-size="13" fill="#5B6763">
    <rect x="1040" y="522" width="14" height="14" rx="3" fill="#5B3FD6"/><text x="1060" y="534">GPU</text>
    <rect x="1110" y="522" width="14" height="14" rx="3" fill="#0E7C68"/><text x="1130" y="534">CPU</text>
    <rect x="1180" y="522" width="14" height="14" rx="3" fill="#A8661A"/><text x="1200" y="534">mixed</text>
    <rect x="1040" y="548" width="14" height="14" rx="3" fill="#E6F0FA" stroke="#1D6FB8"/><text x="1060" y="560">WebSocket (see docs/dev/protocol.md)</text>
  </g>
</svg>
