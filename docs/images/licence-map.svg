<text x="40" y="790" font-size="14" font-weight="400" fill="#16201D" text-anchor="start">Apache 2.0 covers this repository's code only. Running the stack as a service puts no GPL duty on you; distributing the image means distributing GPL-3.0 binaries.</text>
<text x="40" y="816" font-size="14" font-weight="400" fill="#16201D" text-anchor="start">Commercial checklist: EDITION=commercial, drop or replace the non-commercial Piper voices (ko, tr, ja, en), decide on the unclear ones, credit CC-BY / CC-BY-SA sources.</text>
<text x="40" y="842" font-size="14" font-weight="400" fill="#5B6763" text-anchor="start">"lessac base": fine-tuned from the en_US lessac checkpoint, whose training data is research-only. Whether that carries over is an open question.</text>
