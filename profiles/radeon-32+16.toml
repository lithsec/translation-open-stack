# PREVIEW, NOT YET RUN: an AMD Radeon AI PRO R9700 (32 GB) with a Radeon RX 9060
# XT (16 GB), under ROCm 7.2+ on Linux. Needs a ROCm build of the stack
# (PyTorch for ROCm, and CTranslate2's ROCm wheels, which are built for these
# two cards: gfx1201 and gfx1200); the image in this repository is CUDA only.
#
#   STACK_PROFILE=radeon-32+16
#
# The split: the translators and VoxCPM2 on the R9700 (card 0), speech
# recognition and the GPU voices on the 9060 XT (card 1). Under ROCm, PyTorch
# and CTranslate2 still call the cards "cuda:0" and "cuda:1". If your system
# numbers them the other way round, swap them with HIP_VISIBLE_DEVICES=1,0.
# Open question until someone runs it: Omnilingual (fairseq2 publishes no ROCm packages; without it,
# Khmer, Lao and the other Omnilingual sources fall back to Whisper).
description = "PREVIEW: AMD R9700 32 GB + RX 9060 XT 16 GB under ROCm (partly run, issue #8)"

# On the R9700: Hy-MT2 at full precision (~15.5 GB; its 4-bit build needs bitsandbytes,
# which may not run on RDNA4) and VoxCPM2 (~6.7 GB). MADLAD 3B (~3.5 GB) was there too
# and the card ran out of memory at start (issue #8), so it is on the RX 9060 XT.
[env]
VOXCPM_GPUS = "0"
HYMT_QUANT = "bf16"
MADLAD = "3b"
# PyTorch's hipBLASLt doesn't support some of these cards' matrix shapes: it warns
# "HIPBLAS_STATUS_NOT_SUPPORTED ... Will attempt to recover" on every call and falls
# back to hipBLAS. Use hipBLAS from the start.
TORCH_BLAS_PREFER_HIPBLASLT = "0"

[devices]
default = "cuda:0"
hymt = "cuda:0"
madlad = "cuda:1"
whisper = "cuda:1"
omni = "cuda:1"
kokoro = "cuda:1"
coqui = "cuda:1"
mms = "cuda:1"
